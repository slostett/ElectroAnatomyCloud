[project]
name = "ElectroAnatomyCloud"
version = "0.1.0"
description = "Tools for processing and visualizing electroanatomic cardiac mesh data"
authors = [{ name = "Stephen Lostetter", email = "slostett@ad.unc.edu" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "SimpleITK",
    "scikit-learn",
    "scipy",
    "trimesh",
    "matplotlib",
    "plotly",
    "scikit-image",
    "dash>=4.0.0",
    "dash-bootstrap-components>=2.0.0",
    "diskcache>=5.0.0",
    "open3d>=0.18.0",
    "tqdm",
]

[build-system]
requires = ["setuptools>=61.0", "wheel", "build"]
build-backend = "setuptools.build_meta"
